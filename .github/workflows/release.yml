name: Release check

# Fires when you publish a GitHub Release. HACS installs the repository content
# at the tag, so manifest.json's version IS the installed version. This guard
# fails the release if the manifest version doesn't match the tag, preventing a
# drift between what HACS offers and what HA shows.
on:
  release:
    types: [published, edited]

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest version must match the release tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          want="${tag#v}"   # strip an optional leading "v"
          have="$(jq -r .version custom_components/schneider_modbus_ha/manifest.json)"
          echo "release tag -> $want"
          echo "manifest    -> $have"
          if [ "$want" != "$have" ]; then
            echo "::error::manifest.json version ($have) does not match the release tag ($want). Bump the manifest and re-tag."
            exit 1
          fi
          echo "Versions match."
