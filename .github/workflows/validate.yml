name: Validate

# Lightweight quality gate: confirms the integration's manifest is valid and it
# will load in Home Assistant. (Not HACS-store validation — this repo is not
# published to the HACS default store.)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest (Home Assistant manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
